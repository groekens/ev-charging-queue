<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EV Charging Queue Management">
    <meta name="theme-color" content="#10b981">
    <title>EV Charging Queue ⚡</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1f2937;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header p { opacity: 0.9; font-size: 14px; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .notification-status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #d1fae5;
            color: #065f46;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .input-section { margin-bottom: 20px; }
        .input-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }
        .input-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        .input-section input:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-section input.trigram {
            text-transform: uppercase;
        }
        .input-section small {
            display: block;
            margin-top: 4px;
            color: #6b7280;
            font-size: 13px;
        }
        .trigram-display {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        .discord-display {
            display: inline-block;
            background: #5865f2;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            margin-left: 8px;
        }
        .site-section { margin-bottom: 24px; }
        .site-section h3 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .station-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .station-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
        }
        .status-dot.busy { background: #ef4444; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #10b981; color: white; }
        .btn-primary:hover:not(:disabled) { background: #059669; transform: translateY(-2px); }
        .btn-secondary { background: #667eea; color: white; }
        .btn-secondary:hover:not(:disabled) { background: #5568d3; transform: translateY(-2px); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover:not(:disabled) { background: #dc2626; transform: translateY(-2px); }
        .btn-small { padding: 8px 16px; font-size: 13px; }
        .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .queue-section { margin-top: 24px; }
        .queue-section h4 { font-size: 16px; margin-bottom: 12px; color: #6b7280; }
        .queue-list { list-style: none; }
        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
        }
        .queue-item.my-turn { background: #d1fae5; border-left-color: #10b981; }
        .queue-position { display: flex; align-items: center; gap: 12px; }
        .position-number {
            background: #667eea;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .queue-trigram { font-weight: 600; font-size: 16px; color: #1f2937; }
        .queue-site { font-size: 12px; color: #6b7280; margin-left: 8px; }
        .empty-state { text-align: center; padding: 32px; color: #9ca3af; }
        .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-info { background: #dbeafe; color: #1e40af; }
        .alert-warning { background: #fef3c7; color: #92400e; }
        .site-preference {
            margin-top: 16px;
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
        }
        .site-preference label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
        }
        .radio-group { display: flex; gap: 16px; flex-wrap: wrap; }
        .radio-option { display: flex; align-items: center; gap: 6px; }
        .radio-option input[type="radio"] { width: 18px; height: 18px; cursor: pointer; }
        @media (max-width: 640px) {
            body { padding: 12px; }
            .header h1 { font-size: 24px; }
            .card { padding: 16px; }
            .action-buttons { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
        .loading { text-align: center; padding: 20px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span>⚡</span><span>EV Charging Queue</span></h1>
            <p>Queue management for LLN 1 & LLN 2</p>
        </div>
        <div id="app"><div class="loading">Loading...</div></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBJCAcq4eKCgJQZ9iOq3mlxjGxxHEjchOk",
            authDomain: "ev-charging-queue.firebaseapp.com",
            projectId: "ev-charging-queue",
            storageBucket: "ev-charging-queue.firebasestorage.app",
            messagingSenderId: "260636724772",
            appId: "1:260636724772:web:2d05d51d46f3cdd55a92b1"
        };

        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1489533546434531451/id6181aUtcNJeM4Aj9tXrEsyW0ySpW0HMGCWZb4P2ubxy2rLfY40AJZTDddXO-oNeN6J";
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const MAX_SPOTS = { 'LLN1': 1, 'LLN2': 4 };

        class EVChargingApp {
            constructor() {
                this.state = {
                    userTrigram: localStorage.getItem('userTrigram') || '',
                    userDiscord: '',
                    sites: { 'LLN1': { charging: [] }, 'LLN2': { charging: [] } },
                    globalQueue: [],
                    lastReset: null
                };
                this.db = db;
                this.init();
            }

            async init() {
                await this.loadState();
                
                // Si trigram existe, charger le Discord associé
                if (this.state.userTrigram) {
                    await this.loadUserDiscord();
                }
                
                this.checkDailyReset();
                this.render();
                
                const stateDocRef = doc(this.db, 'state', 'current');
                onSnapshot(stateDocRef, (doc) => {
                    if (doc.exists()) {
                        const data = doc.data();
                        this.state.sites = data.sites || this.state.sites;
                        this.state.globalQueue = data.globalQueue || [];
                        this.state.lastReset = data.lastReset;
                        this.render();
                    }
                });
            }

            async loadUserDiscord() {
                try {
                    const userDocRef = doc(this.db, 'users', this.state.userTrigram);
                    const docSnap = await getDoc(userDocRef);
                    if (docSnap.exists()) {
                        this.state.userDiscord = docSnap.data().discord || '';
                    }
                } catch (error) {
                    console.error('Error loading user Discord:', error);
                }
            }

            async saveUserDiscord(trigram, discord) {
                try {
                    const userDocRef = doc(this.db, 'users', trigram);
                    await setDoc(userDocRef, {
                        discord: discord,
                        updatedAt: new Date().toISOString()
                    });
                } catch (error) {
                    console.error('Error saving user Discord:', error);
                }
            }

            async loadState() {
                try {
                    const stateDocRef = doc(this.db, 'state', 'current');
                    const docSnap = await getDoc(stateDocRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        this.state.sites = data.sites || this.state.sites;
                        this.state.globalQueue = data.globalQueue || [];
                        this.state.lastReset = data.lastReset;
                    }
                } catch (error) {
                    console.error('Error loading state:', error);
                }
            }

            async saveState() {
                try {
                    const stateDocRef = doc(this.db, 'state', 'current');
                    await setDoc(stateDocRef, {
                        sites: this.state.sites,
                        globalQueue: this.state.globalQueue,
                        lastReset: this.state.lastReset,
                        updatedAt: new Date().toISOString()
                    });
                    return true;
                } catch (error) {
                    console.error('Error saving state:', error);
                    alert('Error saving changes. Please try again.');
                    return false;
                }
            }

            checkDailyReset() {
                const now = new Date();
                const today = now.toDateString();
                if (!this.state.lastReset || this.state.lastReset !== today) {
                    if (!this.state.lastReset || now.getHours() >= 0) {
                        this.resetDaily();
                    }
                }
            }

            async resetDaily() {
                this.state.sites = { 'LLN1': { charging: [] }, 'LLN2': { charging: [] } };
                this.state.globalQueue = [];
                this.state.lastReset = new Date().toDateString();
                await this.saveState();
            }

            async setUserInfo() {
                const trigram = document.getElementById('trigram-input').value.toUpperCase().trim();
                
                if (!trigram) {
                    alert('Please enter your trigram');
                    return;
                }
                
                this.state.userTrigram = trigram;
                localStorage.setItem('userTrigram', trigram);
                
                // Charger le Discord associé
                await this.loadUserDiscord();
                
                // Si pas de Discord, demander
                if (!this.state.userDiscord) {
                    const discord = document.getElementById('discord-input').value.trim();
                    if (!discord) {
                        alert('Please enter your Discord username');
                        return;
                    }
                    this.state.userDiscord = discord;
                    await this.saveUserDiscord(trigram, discord);
                }
                
                this.render();
            }

            resetUser() {
                this.state.userTrigram = '';
                this.state.userDiscord = '';
                localStorage.removeItem('userTrigram');
                this.render();
            }

            async sendDiscordNotification(trigram, message) {
                try {
                    // Récupérer le Discord de l'utilisateur
                    const userDocRef = doc(this.db, 'users', trigram);
                    const docSnap = await getDoc(userDocRef);
                    
                    if (!docSnap.exists() || !docSnap.data().discord) {
                        console.error('No Discord username found for', trigram);
                        return;
                    }
                    
                    const discord = docSnap.data().discord;
                    
                    await fetch(DISCORD_WEBHOOK, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: `@${discord} ${message}`
                        })
                    });
                } catch (error) {
                    console.error('Error sending Discord notification:', error);
                }
            }

            async startCharging(site) {
                if (!this.state.userTrigram) {
                    alert('Please enter your trigram');
                    return;
                }
                const siteData = this.state.sites[site];
                const alreadyCharging = Object.values(this.state.sites).some(s => s.charging.includes(this.state.userTrigram));
                if (alreadyCharging) {
                    alert('You are already charging at another site');
                    return;
                }
                if (siteData.charging.length >= MAX_SPOTS[site]) {
                    alert('No charging spot available. Use "Join Queue" to wait.');
                    return;
                }
                siteData.charging.push(this.state.userTrigram);
                this.state.globalQueue = this.state.globalQueue.filter(item => item.trigram !== this.state.userTrigram);
                await this.saveState();
            }

            async finishCharging(site) {
                const siteData = this.state.sites[site];
                siteData.charging = siteData.charging.filter(t => t !== this.state.userTrigram);
                const nextPerson = this.state.globalQueue.find(item => item.preference === 'both' || item.preference === site);
                if (nextPerson) {
                    await this.sendDiscordNotification(
                        nextPerson.trigram, 
                        `🔌 **Your turn!** A charging spot is now available at **${site}**`
                    );
                }
                await this.saveState();
            }

            async reportSpotFree(site) {
                if (confirm(`Confirm: Is there really a free spot at ${site}?`)) {
                    const nextPerson = this.state.globalQueue.find(item => item.preference === 'both' || item.preference === site);
                    if (nextPerson) {
                        await this.sendDiscordNotification(
                            nextPerson.trigram,
                            `🔌 **Spot reported free!** Someone reported a free spot at **${site}**`
                        );
                        alert(`${nextPerson.trigram} has been notified via Discord`);
                    } else {
                        alert(`No one is waiting for ${site} at the moment.`);
                    }
                }
            }

            async reportNoSpot() {
                if (confirm('Confirm: Was your spot not available when you arrived?')) {
                    alert('You have kept your place in the queue. Sorry for the inconvenience!');
                }
            }

            async joinQueue(preference = 'both') {
                if (!this.state.userTrigram) {
                    alert('Please enter your trigram');
                    return;
                }
                
                if (!this.state.userDiscord) {
                    alert('Please set up your Discord username first (click Change)');
                    return;
                }
                
                const alreadyInQueue = this.state.globalQueue.some(item => item.trigram === this.state.userTrigram);
                if (alreadyInQueue) {
                    alert('You are already in the queue');
                    return;
                }
                if (preference === 'both') {
                    const lln1Available = MAX_SPOTS['LLN1'] - this.state.sites['LLN1'].charging.length;
                    const lln2Available = MAX_SPOTS['LLN2'] - this.state.sites['LLN2'].charging.length;
                    if (lln1Available > 0 || lln2Available > 0) {
                        const availableSites = [];
                        if (lln1Available > 0) availableSites.push('LLN1');
                        if (lln2Available > 0) availableSites.push('LLN2');
                        alert(`⚠️ There are spots available at ${availableSites.join(' and ')}! Please use "I'm plugging in" instead of joining the queue.`);
                        return;
                    }
                } else {
                    const available = MAX_SPOTS[preference] - this.state.sites[preference].charging.length;
                    if (available > 0) {
                        alert(`⚠️ There are ${available} spot(s) available at ${preference}! Please use "I'm plugging in" instead of joining the queue.`);
                        return;
                    }
                }
                const timestamp = Date.now();
                this.state.globalQueue.push({ trigram: this.state.userTrigram, timestamp, preference });
                await this.saveState();
            }

            async leaveQueue() {
                this.state.globalQueue = this.state.globalQueue.filter(item => item.trigram !== this.state.userTrigram);
                await this.saveState();
            }

            getUserStatus() {
                for (const [site, data] of Object.entries(this.state.sites)) {
                    if (data.charging.includes(this.state.userTrigram)) {
                        return { status: 'charging', site };
                    }
                }
                const queueItem = this.state.globalQueue.find(item => item.trigram === this.state.userTrigram);
                if (queueItem) {
                    return { status: 'queued', position: this.state.globalQueue.indexOf(queueItem) + 1, preference: queueItem.preference };
                }
                return { status: 'idle' };
            }

            render() {
                const app = document.getElementById('app');
                const userStatus = this.getUserStatus();
                let html = '';

                if (!this.state.userTrigram || !this.state.userDiscord) {
                    html += `<div class="card">`;
                    
                    html += `<div class="input-section">
                        <label for="trigram-input">Your trigram:</label>
                        <input type="text" id="trigram-input" class="trigram" placeholder="e.g., GRO" maxlength="4" autocomplete="off" value="${this.state.userTrigram}"/>
                    </div>`;
                    
                    if (!this.state.userDiscord) {
                        html += `<div class="input-section">
                            <label for="discord-input">Your Discord username:</label>
                            <input type="text" id="discord-input" placeholder="e.g., gabriel_roekens" autocomplete="off"/>
                            <small>You'll receive notifications via Discord mention</small>
                        </div>`;
                    }
                    
                    html += `<div style="margin-top: 12px;">
                        <button class="btn btn-primary" onclick="app.setUserInfo()">Confirm</button>
                    </div></div>`;
                } else {
                    html += `<div class="notification-status">
                        <span>💬</span>
                        <span>Discord notifications enabled for @${this.state.userDiscord}</span>
                    </div>`;

                    if (userStatus.status === 'charging') {
                        html += `<div class="alert alert-success"><span style="font-size: 24px;">🔌</span><div><strong>You are charging at ${userStatus.site}</strong><div style="font-size: 14px; margin-top: 4px;">Don't forget to signal when you're done</div></div></div>`;
                    } else if (userStatus.status === 'queued') {
                        const isNextInLine = userStatus.position === 1;
                        html += `<div class="alert ${isNextInLine ? 'alert-warning' : 'alert-info'}"><span style="font-size: 24px;">${isNextInLine ? '⏰' : '⏳'}</span><div><strong>${isNextInLine ? 'You are next in line!' : `Position ${userStatus.position} in queue`}</strong><div style="font-size: 14px; margin-top: 4px;">${userStatus.preference === 'both' ? 'Waiting for any site' : `Waiting for ${userStatus.preference} only`}</div></div></div>`;
                    }

                    html += `<div class="card"><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;"><div><span style="color: #6b7280; font-size: 14px;">Logged in as</span><div style="margin-top: 8px;"><span class="trigram-display">${this.state.userTrigram}</span><span class="discord-display">@${this.state.userDiscord}</span></div></div><button class="btn btn-small" onclick="app.resetUser()" style="background: #9ca3af; color: white;">Change</button></div>`;

                    ['LLN1', 'LLN2'].forEach(site => {
                        const siteData = this.state.sites[site];
                        const available = MAX_SPOTS[site] - siteData.charging.length;
                        const isCharging = userStatus.status === 'charging' && userStatus.site === site;
                        const isQueued = userStatus.status === 'queued';
                        const isFull = available === 0;

                        html += `<div class="site-section"><h3><span>📍</span><span>${site}</span></h3><div class="station-info"><div class="station-status"><span class="status-dot ${available > 0 ? '' : 'busy'}"></span><span>${available > 0 ? `${available} spot(s) available` : 'Full'}</span></div><span style="color: #6b7280; font-size: 14px;">${siteData.charging.length}/${MAX_SPOTS[site]}</span></div><div class="action-buttons">`;
                        
                        if (!isCharging && userStatus.status !== 'charging' && !isQueued) {
                            html += `<button class="btn btn-primary" onclick="app.startCharging('${site}')">🔌 I'm plugging in</button>`;
                        }
                        if (isCharging) {
                            html += `<button class="btn btn-danger" onclick="app.finishCharging('${site}')">✅ I'm done charging</button>`;
                        }
                        if (isFull && !isCharging && userStatus.status !== 'charging') {
                            html += `<button class="btn btn-small" onclick="app.reportSpotFree('${site}')" style="background: #f59e0b; color: white;">📢 Report spot free</button>`;
                        }
                        html += `</div></div>`;
                    });

                    html += `<div class="site-section"><h3><span>👥</span><span>Waiting Queue</span></h3>`;

                    if (this.state.globalQueue.length > 0) {
                        html += `<div class="queue-section"><h4>People waiting (${this.state.globalQueue.length})</h4><ul class="queue-list">`;
                        this.state.globalQueue.forEach((item, index) => {
                            html += `<li class="queue-item ${item.trigram === this.state.userTrigram && index === 0 ? 'my-turn' : ''}"><div class="queue-position"><span class="position-number">${index + 1}</span><span class="queue-trigram">${item.trigram}${item.preference !== 'both' ? `<span class="queue-site">(${item.preference} only)</span>` : ''}</span></div>${item.trigram === this.state.userTrigram && index === 0 ? `<button class="btn btn-small btn-danger" onclick="app.reportNoSpot()" style="margin-left: 8px;">⚠️ No spot available</button>` : ''}</li>`;
                        });
                        html += `</ul></div>`;
                    } else {
                        html += `<div class="empty-state"><div class="empty-state-icon">✨</div><p>No one waiting</p></div>`;
                    }

                    html += `</div>`;

                    if (userStatus.status === 'idle') {
                        html += `<div class="site-preference"><label>Join the waiting queue:</label><div class="radio-group"><div class="radio-option"><input type="radio" id="pref-both" name="site-pref" value="both" checked><label for="pref-both">Any site</label></div><div class="radio-option"><input type="radio" id="pref-lln1" name="site-pref" value="LLN1"><label for="pref-lln1">LLN1 only</label></div><div class="radio-option"><input type="radio" id="pref-lln2" name="site-pref" value="LLN2"><label for="pref-lln2">LLN2 only</label></div></div><div style="margin-top: 16px;"><button class="btn btn-secondary" onclick="app.joinQueueWithPreference()">⏳ Join queue</button></div></div>`;
                    } else if (userStatus.status === 'queued') {
                        html += `<div style="margin-top: 16px;"><button class="btn btn-danger" onclick="app.leaveQueue()">❌ Leave queue</button></div>`;
                    }

                    html += `</div>`;
                }

                app.innerHTML = html;
            }

            joinQueueWithPreference() {
                const preference = document.querySelector('input[name="site-pref"]:checked').value;
                this.joinQueue(preference);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.app = new EVChargingApp();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EV Charging Queue Management">
    <meta name="theme-color" content="#10b981">
    <title>EV Charging Queue ⚡</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1f2937;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header p { opacity: 0.9; font-size: 14px; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .input-section { margin-bottom: 20px; }
        .input-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }
        .input-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        .input-section input:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-section input.xgram {
            text-transform: uppercase;
        }
        .input-section small {
            display: block;
            margin-top: 4px;
            color: #6b7280;
            font-size: 13px;
        }
        .help-link {
            display: inline-block;
            margin-top: 8px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .help-link:hover { text-decoration: underline; }
        .xgram-display {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        .site-section { margin-bottom: 24px; }
        .site-section h3 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .site-lln1 h3 { color: #ef4444; }
        .site-lln2 h3 { color: #3b82f6; }
        .station-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #10b981;
        }
        .site-lln1 .station-info { border-left-color: #ef4444; background: #fef2f2; }
        .site-lln2 .station-info { border-left-color: #3b82f6; background: #eff6ff; }
        .station-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
        }
        .status-dot.busy { background: #ef4444; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #10b981; color: white; }
        .btn-primary:hover:not(:disabled) { background: #059669; transform: translateY(-2px); }
        .btn-secondary { background: #667eea; color: white; }
        .btn-secondary:hover:not(:disabled) { background: #5568d3; transform: translateY(-2px); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover:not(:disabled) { background: #dc2626; transform: translateY(-2px); }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover:not(:disabled) { background: #d97706; transform: translateY(-2px); }
        .btn-small { padding: 8px 16px; font-size: 13px; }
        .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .queue-section { margin-top: 24px; }
        .queue-section h4 { font-size: 16px; margin-bottom: 12px; color: #6b7280; }
        .queue-list { list-style: none; }
        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
        }
        .queue-item.my-turn { background: #d1fae5; border-left-color: #10b981; }
        .queue-position { display: flex; align-items: center; gap: 12px; }
        .position-number {
            background: #667eea;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .queue-xgram { font-weight: 600; font-size: 16px; color: #1f2937; }
        .queue-site { font-size: 12px; color: #6b7280; margin-left: 8px; }
        .empty-state { text-align: center; padding: 32px; color: #9ca3af; }
        .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-info { background: #dbeafe; color: #1e40af; }
        .alert-warning { background: #fef3c7; color: #92400e; }
        .site-preference {
            margin-top: 16px;
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
        }
        .site-preference label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
        }
        .radio-group { display: flex; gap: 16px; flex-wrap: wrap; }
        .radio-option { display: flex; align-items: center; gap: 6px; }
        .radio-option input[type="radio"] { width: 18px; height: 18px; cursor: pointer; }
        @media (max-width: 640px) {
            body { padding: 12px; }
            .header h1 { font-size: 24px; }
            .card { padding: 16px; }
            .action-buttons { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
        .loading { text-align: center; padding: 20px; color: #6b7280; }
        .snooze-notice {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span>⚡</span><span>EV Charging Queue</span></h1>
            <p>Queue management for LLN 1 & LLN 2</p>
        </div>
        <div id="app"><div class="loading">Loading...</div></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBJCAcq4eKCgJQZ9iOq3mlxjGxxHEjchOk",
            authDomain: "ev-charging-queue.firebaseapp.com",
            projectId: "ev-charging-queue",
            storageBucket: "ev-charging-queue.firebasestorage.app",
            messagingSenderId: "260636724772",
            appId: "1:260636724772:web:2d05d51d46f3cdd55a92b1"
        };

        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1489533546434531451/id6181aUtcNJeM4Aj9tXrEsyW0ySpW0HMGCWZb4P2ubxy2rLfY40AJZTDddXO-oNeN6J";
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const MAX_SPOTS = { 'LLN1': 1, 'LLN2': 4 };
        const REMINDER_DELAY = 15 * 60 * 1000; // 15 minutes

        class EVChargingApp {
            constructor() {
                this.state = {
                    userXgram: localStorage.getItem('userXgram') || '',
                    userDiscord: '',
                    sites: { 'LLN1': { charging: [] }, 'LLN2': { charging: [] } },
                    globalQueue: [],
                    lastReset: null,
                    notificationTimestamps: JSON.parse(localStorage.getItem('notificationTimestamps') || '{}')
                };
                this.db = db;
                this.reminderInterval = null;
                this.init();
            }

            async init() {
                await this.loadState();
                
                if (this.state.userXgram) {
                    await this.loadUserDiscord();
                }
                
                this.checkDailyReset();
                this.startReminderChecker();
                this.render();
                
                const stateDocRef = doc(this.db, 'state', 'current');
                onSnapshot(stateDocRef, (doc) => {
                    if (doc.exists()) {
                        const data = doc.data();
                        this.state.sites = data.sites || this.state.sites;
                        this.state.globalQueue = data.globalQueue || [];
                        this.state.lastReset = data.lastReset;
                        this.checkForMyTurn();
                        this.render();
                    }
                });
            }

            startReminderChecker() {
                // Vérifier toutes les minutes s'il faut envoyer un rappel
                this.reminderInterval = setInterval(() => {
                    this.checkAndSendReminders();
                }, 60 * 1000);
            }

            checkAndSendReminders() {
                const now = Date.now();
                const userStatus = this.getUserStatus();
                
                // Si l'utilisateur est premier dans la queue
                if (userStatus.status === 'queued' && userStatus.position === 1) {
                    const notifTime = this.state.notificationTimestamps[this.state.userXgram];
                    
                    if (notifTime && (now - notifTime) >= REMINDER_DELAY) {
                        // Envoyer un rappel
                        this.sendReminderNotification();
                        // Réinitialiser pour ne pas spam
                        delete this.state.notificationTimestamps[this.state.userXgram];
                        localStorage.setItem('notificationTimestamps', JSON.stringify(this.state.notificationTimestamps));
                    }
                }
            }

            async sendReminderNotification() {
                if (!this.state.userDiscord) return;
                
                try {
                    const message = `⏰ **Reminder!** You've been notified 15 minutes ago. Are you still available to charge? If not, please snooze your turn in the app.`;
                    
                    await fetch(DISCORD_WEBHOOK, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: `<@${this.state.userDiscord}> ${message}`
                        })
                    });
                } catch (error) {
                    console.error('Error sending reminder:', error);
                }
            }

            checkForMyTurn() {
                const userStatus = this.getUserStatus();
                
                // Si je viens de devenir premier dans la queue, enregistrer le timestamp
                if (userStatus.status === 'queued' && userStatus.position === 1) {
                    if (!this.state.notificationTimestamps[this.state.userXgram]) {
                        this.state.notificationTimestamps[this.state.userXgram] = Date.now();
                        localStorage.setItem('notificationTimestamps', JSON.stringify(this.state.notificationTimestamps));
                    }
                }
            }

            async loadUserDiscord() {
                try {
                    const userDocRef = doc(this.db, 'users', this.state.userXgram);
                    const docSnap = await getDoc(userDocRef);
                    if (docSnap.exists()) {
                        this.state.userDiscord = docSnap.data().discord || '';
                    }
                } catch (error) {
                    console.error('Error loading user Discord:', error);
                }
            }

            async saveUserDiscord(xgram, discord) {
                try {
                    const userDocRef = doc(this.db, 'users', xgram);
                    await setDoc(userDocRef, {
                        discord: discord,
                        updatedAt: new Date().toISOString()
                    });
                } catch (error) {
                    console.error('Error saving user Discord:', error);
                }
            }

            async loadState() {
                try {
                    const stateDocRef = doc(this.db, 'state', 'current');
                    const docSnap = await getDoc(stateDocRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        this.state.sites = data.sites || this.state.sites;
                        this.state.globalQueue = data.globalQueue || [];
                        this.state.lastReset = data.lastReset;
                    }
                } catch (error) {
                    console.error('Error loading state:', error);
                }
            }

            async saveState() {
                try {
                    const stateDocRef = doc(this.db, 'state', 'current');
                    await setDoc(stateDocRef, {
                        sites: this.state.sites,
                        globalQueue: this.state.globalQueue,
                        lastReset: this.state.lastReset,
                        updatedAt: new Date().toISOString()
                    });
                    return true;
                } catch (error) {
                    console.error('Error saving state:', error);
                    alert('Error saving changes. Please try again.');
                    return false;
                }
            }

            checkDailyReset() {
                const now = new Date();
                const today = now.toDateString();
                if (!this.state.lastReset || this.state.lastReset !== today) {
                    if (!this.state.lastReset || now.getHours() >= 0) {
                        this.resetDaily();
                    }
                }
            }

            async resetDaily() {
                this.state.sites = { 'LLN1': { charging: [] }, 'LLN2': { charging: [] } };
                this.state.globalQueue = [];
                this.state.lastReset = new Date().toDateString();
                await this.saveState();
            }

            async setUserXgram() {
                const xgram = document.getElementById('xgram-input').value.toUpperCase().trim();
                
                if (!xgram) {
                    alert('Please enter your Xgram');
                    return;
                }
                
                this.state.userXgram = xgram;
                localStorage.setItem('userXgram', xgram);
                
                await this.loadUserDiscord();
                this.render();
            }

            async setUserDiscord() {
                const discord = document.getElementById('discord-input').value.trim();
                
                // Si vide, utiliser le Xgram comme fallback
                this.state.userDiscord = discord || this.state.userXgram;
                await this.saveUserDiscord(this.state.userXgram, this.state.userDiscord);
                this.render();
            }

            resetUser() {
                this.state.userXgram = '';
                this.state.userDiscord = '';
                localStorage.removeItem('userXgram');
                this.render();
            }

            async sendDiscordNotification(xgram, message) {
                try {
                    const userDocRef = doc(this.db, 'users', xgram);
                    const docSnap = await getDoc(userDocRef);
                    
                    if (!docSnap.exists() || !docSnap.data().discord) {
                        console.error('No Discord ID found for', xgram);
                        return;
                    }
                    
                    const discordId = docSnap.data().discord;
                    
                    await fetch(DISCORD_WEBHOOK, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: `<@${discordId}> ${message}`
                        })
                    });
                } catch (error) {
                    console.error('Error sending Discord notification:', error);
                }
            }

            async startCharging(site) {
                if (!this.state.userXgram) {
                    alert('Please enter your Xgram');
                    return;
                }
                const siteData = this.state.sites[site];
                const alreadyCharging = Object.values(this.state.sites).some(s => s.charging.includes(this.state.userXgram));
                if (alreadyCharging) {
                    alert('You are already charging at another site');
                    return;
                }
                if (siteData.charging.length >= MAX_SPOTS[site]) {
                    alert('No charging spot available. Use "Join Queue" to wait.');
                    return;
                }
                siteData.charging.push(this.state.userXgram);
                this.state.globalQueue = this.state.globalQueue.filter(item => item.xgram !== this.state.userXgram);
                
                // Effacer le timestamp de notification
                delete this.state.notificationTimestamps[this.state.userXgram];
                localStorage.setItem('notificationTimestamps', JSON.stringify(this.state.notificationTimestamps));
                
                await this.saveState();
            }

            async finishCharging(site) {
                const siteData = this.state.sites[site];
                siteData.charging = siteData.charging.filter(t => t !== this.state.userXgram);
                const nextPerson = this.state.globalQueue.find(item => item.preference === 'both' || item.preference === site);
                if (nextPerson) {
                    await this.sendDiscordNotification(
                        nextPerson.xgram, 
                        `🔌 **Your turn!** A charging spot is now available at **${site}**`
                    );
                }
                await this.saveState();
            }

            async reportSpotFree(site) {
                if (confirm(`Confirm: Is there really a free spot at ${site}?`)) {
                    const nextPerson = this.state.globalQueue.find(item => item.preference === 'both' || item.preference === site);
                    if (nextPerson) {
                        await this.sendDiscordNotification(
                            nextPerson.xgram,
                            `🔌 **Spot reported free!** Someone reported a free spot at **${site}**`
                        );
                        alert(`${nextPerson.xgram} has been notified via Discord`);
                    } else {
                        alert(`No one is waiting for ${site} at the moment.`);
                    }
                }
            }

            async snoozeMyTurn() {
                if (!confirm('Are you sure you want to snooze your turn? The next person will be notified.')) {
                    return;
                }
                
                // Trouver mon index dans la queue
                const myIndex = this.state.globalQueue.findIndex(item => item.xgram === this.state.userXgram);
                if (myIndex !== -1) {
                    // Me retirer de la queue
                    const myItem = this.state.globalQueue.splice(myIndex, 1)[0];
                    
                    // Me remettre à la fin
                    this.state.globalQueue.push(myItem);
                    
                    // Notifier la personne suivante
                    if (this.state.globalQueue.length > 0) {
                        const nextPerson = this.state.globalQueue[0];
                        const availableSites = [];
                        
                        if (nextPerson.preference === 'both' || nextPerson.preference === 'LLN1') {
                            if (MAX_SPOTS['LLN1'] - this.state.sites['LLN1'].charging.length > 0) {
                                availableSites.push('LLN1');
                            }
                        }
                        if (nextPerson.preference === 'both' || nextPerson.preference === 'LLN2') {
                            if (MAX_SPOTS['LLN2'] - this.state.sites['LLN2'].charging.length > 0) {
                                availableSites.push('LLN2');
                            }
                        }
                        
                        if (availableSites.length > 0) {
                            await this.sendDiscordNotification(
                                nextPerson.xgram,
                                `🔌 **Your turn!** A spot is available at **${availableSites.join(' or ')}**`
                            );
                        }
                    }
                    
                    // Effacer le timestamp de notification
                    delete this.state.notificationTimestamps[this.state.userXgram];
                    localStorage.setItem('notificationTimestamps', JSON.stringify(this.state.notificationTimestamps));
                    
                    await this.saveState();
                    alert('Your turn has been snoozed. You are now at the end of the queue.');
                }
            }

            async joinQueue(preference = 'both') {
                if (!this.state.userXgram) {
                    alert('Please enter your Xgram');
                    return;
                }
                
                const alreadyInQueue = this.state.globalQueue.some(item => item.xgram === this.state.userXgram);
                if (alreadyInQueue) {
                    alert('You are already in the queue');
                    return;
                }
                if (preference === 'both') {
                    const lln1Available = MAX_SPOTS['LLN1'] - this.state.sites['LLN1'].charging.length;
                    const lln2Available = MAX_SPOTS['LLN2'] - this.state.sites['LLN2'].charging.length;
                    if (lln1Available > 0 || lln2Available > 0) {
                        const availableSites = [];
                        if (lln1Available > 0) availableSites.push('LLN1');
                        if (lln2Available > 0) availableSites.push('LLN2');
                        alert(`⚠️ There are spots available at ${availableSites.join(' and ')}! Please use "I'm plugging in" instead of joining the queue.`);
                        return;
                    }
                } else {
                    const available = MAX_SPOTS[preference] - this.state.sites[preference].charging.length;
                    if (available > 0) {
                        alert(`⚠️ There are ${available} spot(s) available at ${preference}! Please use "I'm plugging in" instead of joining the queue.`);
                        return;
                    }
                }
                const timestamp = Date.now();
                this.state.globalQueue.push({ xgram: this.state.userXgram, timestamp, preference });
                await this.saveState();
            }

            async leaveQueue() {
                this.state.globalQueue = this.state.globalQueue.filter(item => item.xgram !== this.state.userXgram);
                
                // Effacer le timestamp de notification
                delete this.state.notificationTimestamps[this.state.userXgram];
                localStorage.setItem('notificationTimestamps', JSON.stringify(this.state.notificationTimestamps));
                
                await this.saveState();
            }

            getUserStatus() {
                for (const [site, data] of Object.entries(this.state.sites)) {
                    if (data.charging.includes(this.state.userXgram)) {
                        return { status: 'charging', site };
                    }
                }
                const queueItem = this.state.globalQueue.find(item => item.xgram === this.state.userXgram);
                if (queueItem) {
                    return { status: 'queued', position: this.state.globalQueue.indexOf(queueItem) + 1, preference: queueItem.preference };
                }
                return { status: 'idle' };
            }

            render() {
                const app = document.getElementById('app');
                const userStatus = this.getUserStatus();
                let html = '';

                // Étape 1 : Demander le Xgram
                if (!this.state.userXgram) {
                    html += `<div class="card">
                        <div class="input-section">
                            <label for="xgram-input">Your Xgram (trigram, quadrigram, etc.):</label>
                            <input type="text" id="xgram-input" class="xgram" placeholder="e.g., GRO, ABCD" maxlength="10" autocomplete="off"/>
                            <small>Enter your unique identifier</small>
                        </div>
                        <div style="margin-top: 12px;">
                            <button class="btn btn-primary" onclick="app.setUserXgram()">Continue</button>
                        </div>
                    </div>`;
                } 
                // Étape 2 : Si Xgram existe mais pas de Discord, demander Discord
                else if (!this.state.userDiscord) {
                    html += `<div class="card">
                        <div style="margin-bottom: 20px;">
                            <span style="color: #6b7280; font-size: 14px;">Logged in as</span>
                            <div style="margin-top: 8px;">
                                <span class="xgram-display">${this.state.userXgram}</span>
                            </div>
                        </div>
                        <div class="input-section">
                            <label for="discord-input">Your Discord ID or username (optional):</label>
                            <input type="text" id="discord-input" placeholder="e.g., 687682421847883779 or gabrielgro" autocomplete="off"/>
                            <small>💡 <strong>Recommended:</strong> Enter your Discord ID to receive @mentions. 
                                <a href="https://support.discord.com/hc/en-us/articles/206346498-Where-can-I-find-my-User-Server-Message-ID" target="_blank" class="help-link">How to find it →</a>
                            </small>
                            <small style="margin-top: 8px;">⚠️ If you skip this, notifications will just mention your Xgram (${this.state.userXgram}) without @tagging you</small>
                        </div>
                        <div style="margin-top: 12px; display: flex; gap: 12px;">
                            <button class="btn btn-primary" onclick="app.setUserDiscord()">Continue</button>
                            <button class="btn btn-small" onclick="app.resetUser()" style="background: #9ca3af; color: white;">Back</button>
                        </div>
                    </div>`;
                } 
                // Étape 3 : Interface principale
                else {
                    if (userStatus.status === 'charging') {
                        html += `<div class="alert alert-success"><span style="font-size: 24px;">🔌</span><div><strong>You are charging at ${userStatus.site}</strong><div style="font-size: 14px; margin-top: 4px;">Don't forget to signal when you're done</div></div></div>`;
                    } else if (userStatus.status === 'queued') {
                        const isNextInLine = userStatus.position === 1;
                        html += `<div class="alert ${isNextInLine ? 'alert-warning' : 'alert-info'}"><span style="font-size: 24px;">${isNextInLine ? '⏰' : '⏳'}</span><div><strong>${isNextInLine ? 'You are next in line!' : `Position ${userStatus.position} in queue`}</strong><div style="font-size: 14px; margin-top: 4px;">${userStatus.preference === 'both' ? 'Waiting for any site' : `Waiting for ${userStatus.preference} only`}</div>`;
                        
                        if (isNextInLine) {
                            html += `<div class="snooze-notice">⏰ You'll receive a reminder in 15 minutes if you don't plug in</div>`;
                        }
                        
                        html += `</div></div>`;
                    }

                    html += `<div class="card"><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;"><div><span style="color: #6b7280; font-size: 14px;">Logged in as</span><div style="margin-top: 8px;"><span class="xgram-display">${this.state.userXgram}</span></div></div><button class="btn btn-small" onclick="app.resetUser()" style="background: #9ca3af; color: white;">Change</button></div>`;

                    ['LLN1', 'LLN2'].forEach(site => {
                        const siteData = this.state.sites[site];
                        const available = MAX_SPOTS[site] - siteData.charging.length;
                        const isCharging = userStatus.status === 'charging' && userStatus.site === site;
                        const isQueued = userStatus.status === 'queued';
                        const isFull = available === 0;

                        html += `<div class="site-section site-${site.toLowerCase()}"><h3><span>📍</span><span>${site}</span></h3><div class="station-info"><div class="station-status"><span class="status-dot ${available > 0 ? '' : 'busy'}"></span><span>${available > 0 ? `${available} spot(s) available` : 'Full'}</span></div><span style="color: #6b7280; font-size: 14px;">${siteData.charging.length}/${MAX_SPOTS[site]}</span></div><div class="action-buttons">`;
                        
                        if (!isCharging && userStatus.status !== 'charging' && !isQueued) {
                            html += `<button class="btn btn-primary" onclick="app.startCharging('${site}')">🔌 I'm plugging in</button>`;
                        }
                        if (isCharging) {
                            html += `<button class="btn btn-danger" onclick="app.finishCharging('${site}')">✅ I'm done charging</button>`;
                        }
                        if (isFull && !isCharging && userStatus.status !== 'charging') {
                            html += `<button class="btn btn-small btn-warning" onclick="app.reportSpotFree('${site}')">📢 Report spot free</button>`;
                        }
                        html += `</div></div>`;
                    });

                    html += `<div class="site-section"><h3><span>👥</span><span>Waiting Queue</span></h3>`;

                    if (this.state.globalQueue.length > 0) {
                        html += `<div class="queue-section"><h4>People waiting (${this.state.globalQueue.length})</h4><ul class="queue-list">`;
                        this.state.globalQueue.forEach((item, index) => {
                            const isMe = item.xgram === this.state.userXgram;
                            const isFirst = index === 0;
                            html += `<li class="queue-item ${isMe && isFirst ? 'my-turn' : ''}">
                                <div class="queue-position">
                                    <span class="position-number">${index + 1}</span>
                                    <span class="queue-xgram">${item.xgram}${item.preference !== 'both' ? `<span class="queue-site">(${item.preference} only)</span>` : ''}</span>
                                </div>`;
                            
                            if (isMe && isFirst) {
                                html += `<button class="btn btn-small btn-warning" onclick="app.snoozeMyTurn()">😴 Snooze my turn</button>`;
                            }
                            
                            html += `</li>`;
                        });
                        html += `</ul></div>`;
                    } else {
                        html += `<div class="empty-state"><div class="empty-state-icon">✨</div><p>No one waiting</p></div>`;
                    }

                    html += `</div>`;

                    if (userStatus.status === 'idle') {
                        html += `<div class="site-preference"><label>Join the waiting queue:</label><div class="radio-group"><div class="radio-option"><input type="radio" id="pref-both" name="site-pref" value="both" checked><label for="pref-both">Any site</label></div><div class="radio-option"><input type="radio" id="pref-lln1" name="site-pref" value="LLN1"><label for="pref-lln1">LLN1 only</label></div><div class="radio-option"><input type="radio" id="pref-lln2" name="site-pref" value="LLN2"><label for="pref-lln2">LLN2 only</label></div></div><div style="margin-top: 16px;"><button class="btn btn-secondary" onclick="app.joinQueueWithPreference()">⏳ Join queue</button></div></div>`;
                    } else if (userStatus.status === 'queued') {
                        html += `<div style="margin-top: 16px;"><button class="btn btn-danger" onclick="app.leaveQueue()">❌ Leave queue</button></div>`;
                    }

                    html += `</div>`;
                }

                app.innerHTML = html;
            }

            joinQueueWithPreference() {
                const preference = document.querySelector('input[name="site-pref"]:checked').value;
                this.joinQueue(preference);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.app = new EVChargingApp();
        });
    </script>
</body>
</html>
